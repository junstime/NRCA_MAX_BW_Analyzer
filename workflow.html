<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CA BW Analyzer — 워크플로우</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #08080f; --bg2: #0e0e1a; --bg3: #13131f;
    --border: #ffffff0f; --text: #ddddf0; --muted: #555570;
    --c1: #00d4ff; --c2: #7c6fff; --c3: #ff6b9d;
    --c4: #ff9f43; --c5: #1dd1a1; --c6: #ff9ff3;
    --c7: #feca57; --c8: #54a0ff; --c9: #ef4444; --c10: #a78bfa;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    padding: 48px 24px 80px;
  }

  /* ── Header ── */
  .header { text-align: center; margin-bottom: 56px; }
  .header-badge {
    display: inline-block;
    border: 1px solid #7c6fff55;
    border-radius: 2px;
    padding: 3px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--c2);
    letter-spacing: 3px;
    margin-bottom: 18px;
  }
  .header h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 3px;
    background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }
  .header p { color: var(--muted); font-size: 13px; letter-spacing: 1px; }

  /* ── Workflow container ── */
  .workflow { max-width: 800px; margin: 0 auto; position: relative; }

  /* Vertical spine */
  .workflow::before {
    content: '';
    position: absolute;
    left: 21px; top: 22px; bottom: 22px;
    width: 1px;
    background: linear-gradient(to bottom,
      #00d4ff22 0%, #7c6fff44 30%, #ff6b9d33 60%, #1dd1a122 100%);
    pointer-events: none;
  }

  /* ── Phase divider ── */
  .phase-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0 8px 0;
    padding-left: 56px;
  }
  .phase-divider::before {
    content: '';
    position: absolute;
    left: 14px;
    width: 15px;
    height: 1px;
    background: var(--pd-color, #7c6fff);
    opacity: .4;
  }
  .phase-divider-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--pd-color, #7c6fff);
    opacity: .55;
    font-weight: 700;
    text-transform: uppercase;
  }

  /* ── Step ── */
  .step { position: relative; margin-bottom: 4px; }

  .step-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 16px 12px 0;
    border-radius: 5px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background .2s, border-color .2s;
    user-select: none;
  }
  .step-header:hover { background: #ffffff05; }
  .step-header.active {
    border-color: color-mix(in srgb, var(--step-color, #7c6fff) 30%, transparent);
    background: color-mix(in srgb, var(--step-color, #7c6fff) 5%, transparent);
  }

  .node {
    width: 44px; height: 44px;
    border-radius: 5px;
    background: var(--bg2);
    border: 2px solid var(--step-color, #7c6fff);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    position: relative; z-index: 1;
    transition: background .2s, box-shadow .2s, color .2s;
    color: var(--step-color, #7c6fff);
  }
  .step-header.active .node {
    background: var(--step-color, #7c6fff);
    box-shadow: 0 0 18px color-mix(in srgb, var(--step-color, #7c6fff) 50%, transparent);
    color: #08080f;
  }

  .step-meta { flex: 1; min-width: 0; }
  .step-phase-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; flex-wrap: wrap; }
  .phase-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--step-color, #7c6fff);
    opacity: .7;
    font-weight: 700;
  }
  .branch-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 2px;
    background: color-mix(in srgb, var(--step-color) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--step-color) 50%, transparent);
    color: var(--step-color);
    letter-spacing: .5px;
  }
  .step-title {
    font-size: 15px; font-weight: 700; color: var(--text);
    transition: color .2s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .step-header.active .step-title { color: var(--step-color, #7c6fff); }
  .step-subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--muted); margin-top: 2px;
  }
  .step-arrow {
    font-size: 10px;
    color: var(--step-color, #7c6fff);
    opacity: .3;
    transition: opacity .2s, transform .25s;
    flex-shrink: 0;
  }
  .step-header.active .step-arrow { opacity: 1; transform: rotate(90deg); }

  .connector {
    position: absolute; left: 18px; bottom: -7px;
    font-size: 10px; color: #2a2a3a; z-index: 1; pointer-events: none;
  }

  /* ── Detail panel ── */
  .detail {
    display: none;
    margin: 4px 0 8px 60px;
    padding: 14px 18px;
    background: var(--bg2);
    border: 1px solid color-mix(in srgb, var(--step-color, #7c6fff) 20%, transparent);
    border-left: 2px solid var(--step-color, #7c6fff);
    border-radius: 0 5px 5px 0;
    animation: slideDown .2s ease;
  }
  .detail.open { display: block; }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .detail-row {
    display: flex; gap: 10px;
    font-size: 12.5px; color: #9999bb; line-height: 1.9;
  }
  .detail-bullet {
    color: var(--step-color, #7c6fff);
    flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
  }
  .detail-text { flex: 1; }
  .detail-code {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--step-color, #7c6fff);
    background: color-mix(in srgb, var(--step-color, #7c6fff) 10%, transparent);
    padding: 1px 6px;
    border-radius: 3px;
    margin: 0 2px;
  }

  /* ── 섹션: 칩셋 테이블, UE BW ── */
  .table-section { max-width: 800px; margin: 44px auto 0; }
  .table-toggle {
    width: 100%;
    padding: 13px 20px;
    background: transparent;
    border: 1px solid #7c6fff44;
    color: var(--c2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: background .2s, border-color .2s;
  }
  .table-toggle:hover { background: #7c6fff0a; border-color: #7c6fff88; }
  .table-toggle .arr { transition: transform .25s; display: inline-block; }
  .table-toggle.open { background: var(--bg2); }
  .table-toggle.open .arr { transform: rotate(180deg); }

  .table-wrap {
    display: none;
    margin-top: 8px;
    border: 1px solid #7c6fff33;
    border-radius: 5px;
    overflow: hidden;
    animation: slideDown .2s ease;
  }
  .table-wrap.open { display: block; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead tr { background: var(--bg2); }
  th {
    padding: 10px 18px; text-align: left;
    color: var(--c2); letter-spacing: 1px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    border-bottom: 1px solid #7c6fff33; font-weight: 700;
  }
  tbody tr { border-bottom: 1px solid #ffffff06; transition: background .15s; }
  tbody tr:nth-child(odd)  { background: var(--bg2); }
  tbody tr:nth-child(even) { background: var(--bg3); }
  tbody tr.hl { background: #7c6fff0d; }
  tbody tr:hover { background: #ffffff07; }
  td { padding: 9px 18px; }
  td.cc { font-family: 'JetBrains Mono', monospace; color: #ccc; }
  td.cc.hl { color: var(--c2); font-weight: 700; }
  td.cf { color: var(--c1); font-family: 'JetBrains Mono', monospace; }
  td.ct { color: var(--c5); font-family: 'JetBrains Mono', monospace; }

  .table-warn {
    padding: 10px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--c4);
    border-top: 1px solid #7c6fff22;
    background: var(--bg3);
    letter-spacing: .3px;
  }

  /* ── UE BW 테이블 ── */
  .ue-toggle { border-color: #1dd1a144; color: var(--c5); margin-top: 12px; }
  .ue-toggle:hover { background: #1dd1a10a; border-color: #1dd1a188; }
  .ue-table-wrap { border-color: #1dd1a133; }
  .ue-table-wrap th { color: var(--c5); border-bottom-color: #1dd1a133; }
  td.ub { font-family: 'JetBrains Mono', monospace; color: #88cc88; font-size: 11.5px; }
  td.ubn { font-family: 'JetBrains Mono', monospace; color: var(--c5); font-weight: 700; }
  td.ubt { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--c4); }

  /* ── Legend ── */
  .legend {
    max-width: 800px; margin: 36px auto 0;
    display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  .hint {
    text-align: center; margin-top: 44px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: #2a2a40; letter-spacing: 2px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-badge">3GPP TS 38.101-1 V19.5.0</div>
  <h1>CA BW Analyzer</h1>
  <p>NR CA Bandwidth Combination 분석 워크플로우 — v2.0</p>
  <div style="margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
    <a href="index.html"     style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#555570;text-decoration:none;padding:3px 12px;border:1px solid #7c6fff33;border-radius:20px;transition:color .15s,border-color .15s;" onmouseover="this.style.color='#00d4ff';this.style.borderColor='#00d4ff';" onmouseout="this.style.color='#555570';this.style.borderColor='#7c6fff33';">← 분석기</a>
    <a href="flowchart.html" style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#555570;text-decoration:none;padding:3px 12px;border:1px solid #7c6fff33;border-radius:20px;transition:color .15s,border-color .15s;" onmouseover="this.style.color='#00d4ff';this.style.borderColor='#00d4ff';" onmouseout="this.style.color='#555570';this.style.borderColor='#7c6fff33';">순서도</a>
    <a href="manual.pdf"     style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#555570;text-decoration:none;padding:3px 12px;border:1px solid #7c6fff33;border-radius:20px;transition:color .15s,border-color .15s;" target="_blank" onmouseover="this.style.color='#e3b341';this.style.borderColor='#e3b341';" onmouseout="this.style.color='#555570';this.style.borderColor='#7c6fff33';">매뉴얼 ↗</a>
  </div>
</div>

<div class="workflow" id="workflow"></div>

<!-- 칩셋 Max BW 규칙표 -->
<div class="table-section">
  <button class="table-toggle" id="tt1" onclick="toggleTable('tt1','tw1','칩셋 Max BW 규칙표')">
    <span>▦</span><span>칩셋 Max BW 규칙표 보기</span><span class="arr">▼</span>
  </button>
  <div class="table-wrap" id="tw1">
    <table>
      <thead><tr><th>구성</th><th>FDD Max</th><th>TDD Max</th><th>케이스 수</th></tr></thead>
      <tbody id="tb1"></tbody>
    </table>
    <div class="table-warn">
      ⚠ 2F+2T는 3케이스 모두 분석 &nbsp;·&nbsp; 1F+3T에서 fddUEMax≥40→HI(40+220), ≤30→LO(30+240)
    </div>
  </div>
</div>

<!-- 단말 지원 BW 기본값 -->
<div class="table-section">
  <button class="table-toggle ue-toggle" id="tt2" onclick="toggleTable('tt2','tw2','단말 지원 BW')">
    <span>⊞</span><span>단말 지원 BW 기본값 보기</span><span class="arr">▼</span>
  </button>
  <div class="table-wrap ue-table-wrap" id="tw2">
    <table>
      <thead><tr><th>밴드</th><th>구분</th><th>지원 BW (MHz)</th></tr></thead>
      <tbody id="tb2"></tbody>
    </table>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#00d4ff"></div>입력 / 파싱</div>
  <div class="legend-item"><div class="legend-dot" style="background:#7c6fff"></div>핵심 판단</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff9f43"></div>BRANCH 분기</div>
  <div class="legend-item"><div class="legend-dot" style="background:#1dd1a1"></div>검사 / 출력</div>
  <div class="legend-item"><div class="legend-dot" style="background:#feca57"></div>Intra 처리</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>5CA / 특수 종료</div>
</div>

<div class="hint">각 단계를 클릭하면 세부 규칙을 확인할 수 있습니다</div>

<script>
// ═══════════════════════════════════════════
//  스텝 데이터
// ═══════════════════════════════════════════
const STEPS = [
  // ── PHASE 1: 입력 파싱 ──
  {
    phase:'INPUT', icon:'⌨', color:'#00d4ff',
    title:'CA 조합 입력 & 밴드 파싱',
    subtitle:'nXA / nXB / nXC / nX(2A) / nX(3A)',
    details:[
      '지원 표기: <span class="detail-code">nXA</span> (단일) · <span class="detail-code">nXB</span> (FDD Intra 2CC) · <span class="detail-code">nXC</span> (TDD Intra 2CC) · <span class="detail-code">nX(2A)</span> · <span class="detail-code">nX(3A)</span>',
      'CC 수: A=1, B=2, C=2, D=3, E=4 &nbsp;(Table 5.3A.5-1 기준 — 알파벳 순서 추정 금지)',
      'FDD 밴드: n1 n2 n3 n5 n7 n8 n12 n20 n25 n26 n28 n66 n71 n75',
      'TDD 밴드: n38 n40 n41 n77 n78 n79',
      '각 밴드 → <span class="detail-code">{ name, cc, isFDD, isTDD, isIntra }</span> 객체 생성',
    ],
  },
  {
    phase:'CHIPSET', icon:'⚙', color:'#ff6b9d',
    title:'칩셋 구조 판단',
    subtitle:'fCnt(FDD CC합) · tCnt(TDD CC합) → 케이스 결정',
    details:[
      'fCnt = Σ (FDD 밴드 CC수) &nbsp;/ &nbsp; tCnt = Σ (TDD 밴드 CC수)',
      'fddUEMax = FDD 밴드 단말 지원 BW 중 최댓값 (1F+3T 분기 기준)',
      '1F+3T: fddUEMax ≥ 40 MHz → <span class="detail-code">HI (40+220)</span> &nbsp;/ &nbsp; fddUEMax ≤ 30 MHz → <span class="detail-code">LO (30+240)</span>',
      '2F+2T: 3케이스 모두 분석 <span class="detail-code">50+200 / 60+180 / 80+140</span>',
      '⚠ 20+250 케이스는 존재하지 않음',
    ],
  },
  // ── PHASE 2: 5CA / 규칙 0 ──
  {
    phase:'5CA CHECK', icon:'⑤', color:'#ef4444',
    title:'5CA 이상 체크',
    subtitle:'총 CC 수 ≥ 5 → 즉시 BCS5 반환',
    branch:'5CA 이상 → BCS5 종료',
    details:[
      '총 CC 수(fCnt + tCnt)가 5 이상이면 DB 탐색 없이 즉시 종료',
      '출력 형식: <span class="detail-code">BCS5 : {칩셋 키}</span> &nbsp;예) <span class="detail-code">BCS5 : 3F+2T</span>',
      '5CA 이상 조합의 실제 BW는 3GPP 표준 문서를 직접 확인해야 함',
      '이 검사는 칩셋 구조 판단 직후, DB 조회 이전에 수행됨',
    ],
  },
  {
    phase:'PRE-CHECK', icon:'✓', color:'#1dd1a1',
    title:'규칙 0 — No Limitation 사전 검사',
    subtitle:'단말 UE Max 합계 ≤ 칩셋 Max?',
    branch:'No Limitation → 즉시 종료',
    details:[
      '각 밴드 단말 지원 Max BW × CC수 합산: FDD합계, TDD합계 계산',
      '조건: FDD합계 ≤ fddMax &nbsp;AND&nbsp; TDD합계 ≤ tddMax',
      '→ 모든 케이스 중 하나라도 충족 시 <span class="detail-code">No Limitation</span> 즉시 출력 후 종료',
      '→ 모든 케이스에서 초과 시 DB 조회 진행',
    ],
  },
  // ── PHASE 3: DB 조회 & BCS 선택 ──
  {
    phase:'DB LOOKUP', icon:'⊙', color:'#54a0ff',
    title:'DB 조회 & ref 해석',
    subtitle:'CA_nXA-nYA-nZ(2A) → O(1) 직접 조회',
    branch:'미발견 / BCS4and5 → 종료',
    details:[
      'DB 키 형식: <span class="detail-code">CA_n1A-n3A-n78C</span> — 3,250개 조합 내장',
      'ref 해석 ①: <span class="detail-code">val.ref: "CA_n78(2A)_BCS0"</span> → base 키 탐색',

    ],
  },
  {
    phase:'BCS SELECT', icon:'★', color:'#ff9ff3',
    title:'BCS 선택',
    subtitle:'score = Σ max(DB허용 ∩ 단말지원) 기준',
    details:[
      '유효BW = <span class="detail-code">DB허용값 ∩ 단말지원BW</span> — 명시적 교집합 계산',
      'score 계산: 각 밴드 유효BW 최댓값 합산',

    ],
  },
  // ── PHASE 4: 탐색 ──
  {
    phase:'INTRA', icon:'⟷', color:'#feca57',
    title:'Intra-band 처리',
    subtitle:'FDD: 합계 고정 / TDD: cc1≤cc2 완전 탐색',
    details:[
      '<b>FDD Intra</b>: CC 합계를 cc_max(최대값)으로 고정 — remainFDD에서 차감',
      'FDD split pairs: cc_max 합계인 모든 (cc1,cc2) 산출 → 포맷 단계에서 각 줄 출력',

      'TDD 예) n78(2A) cc_max=200: 합계≤TDD Max인 모든 split 조합 포함',
    ],
  },
  {

// ── Phase 그룹 정보 ──
const PHASES = [
  { label:'PHASE 1 — 입력 파싱 & 칩셋 판단', color:'#00d4ff', steps:[0,1] },
  { label:'PHASE 2 — 5CA 체크 & 사전 검사',  color:'#ef4444', steps:[2,3] },

  { label:'PHASE 4 — 완전 탐색 & Pareto',    color:'#1dd1a1', steps:[6,7,8,9] },
  { label:'PHASE 5 — 정렬 & 출력',           color:'#a78bfa', steps:[10,11] },
];

// ── Build workflow ──
const wf = document.getElementById('workflow');

// phase→step 매핑
const stepPhase = {};
PHASES.forEach(p => p.steps.forEach(si => stepPhase[si] = p));

let phaseInserted = new Set();
STEPS.forEach((s, i) => {
  // Phase divider
  const ph = stepPhase[i];
  if (ph && !phaseInserted.has(ph.label)) {
    phaseInserted.add(ph.label);
    const div = document.createElement('div');
    div.className = 'phase-divider';
    div.style.setProperty('--pd-color', ph.color);
    div.innerHTML = `<span class="phase-divider-label">${ph.label}</span>`;
    wf.appendChild(div);
  }

  const num = String(i+1).padStart(2,'0');
  const el = document.createElement('div');
  el.className = 'step';
  el.id = `step-${i}`;
  el.innerHTML = `
    <div class="step-header" id="hdr-${i}" style="--step-color:${s.color}" onclick="toggle(${i})">
      <div class="node">${s.icon}</div>
      <div class="step-meta">
        <div class="step-phase-row">
          <span class="phase-label">${num} · ${s.phase}</span>
          ${s.branch ? `<span class="branch-badge" style="--step-color:${s.color}">BRANCH → ${s.branch}</span>` : ''}
        </div>
        <div class="step-title">${s.title}</div>
        <div class="step-subtitle">${s.subtitle}</div>
      </div>
      <div class="step-arrow">▶</div>
    </div>
    ${s.details.length ? `
    <div class="detail" id="det-${i}" style="--step-color:${s.color}">
      ${s.details.map(d=>`
        <div class="detail-row">
          <span class="detail-bullet">›</span>
          <span class="detail-text">${d}</span>
        </div>`).join('')}
    </div>` : ''}
    ${i < STEPS.length-1 ? '<div class="connector">▼</div>' : ''}
  `;
  wf.appendChild(el);
});

function toggle(i) {
  const hdr = document.getElementById(`hdr-${i}`);
  const det = document.getElementById(`det-${i}`);
  const isOpen = hdr.classList.contains('active');
  document.querySelectorAll('.step-header').forEach(h=>h.classList.remove('active'));
  document.querySelectorAll('.detail').forEach(d=>d.classList.remove('open'));
  if (!isOpen) { hdr.classList.add('active'); if(det) det.classList.add('open'); }
}

function toggleTable(btnId, wrapId, label) {
  const btn = document.getElementById(btnId);
  const wrap = document.getElementById(wrapId);
  const isOpen = btn.classList.contains('open');
  btn.classList.toggle('open', !isOpen);
  wrap.classList.toggle('open', !isOpen);
  const txtNode = btn.childNodes[1];
  if (txtNode) txtNode.textContent = isOpen ? ` ${label} 보기` : ` ${label} 숨기기`;
