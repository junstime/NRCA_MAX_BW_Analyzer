<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CA BW Analyzer — 동작 순서도</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0e1a; --surface:#111827; --border:#1e293b;
    --accent:#00d4ff; --accent2:#7c3aed; --accent3:#10b981;
    --warn:#f59e0b; --danger:#ef4444;
    --text:#e2e8f0; --dim:#64748b; --node-bg:#131c2e; --node-border:#1e3a5f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans KR',sans-serif;min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;
    background-image:linear-gradient(rgba(0,212,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.03) 1px,transparent 1px);
    background-size:40px 40px;pointer-events:none;z-index:0;}
  header{position:relative;z-index:10;padding:32px 40px 20px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:20px;}
  header h1{font-family:'IBM Plex Mono',monospace;font-size:1.4rem;font-weight:700;color:var(--accent);letter-spacing:-.02em;}
  header span{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--dim);}
  .legend{position:relative;z-index:10;display:flex;gap:20px;padding:14px 40px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .li{display:flex;align-items:center;gap:7px;font-size:.72rem;color:var(--dim);font-family:'IBM Plex Mono',monospace;}
  .lb{width:13px;height:13px;border-radius:2px;}
  .canvas-wrap{position:relative;z-index:10;width:100%;overflow-x:auto;padding:40px 20px 60px;}
  svg#fc{display:block;margin:0 auto;overflow:visible;}
  .glow-b{filter:drop-shadow(0 0 8px rgba(0,212,255,.5));}
  .glow-g{filter:drop-shadow(0 0 8px rgba(16,185,129,.5));}
  .glow-w{filter:drop-shadow(0 0 8px rgba(245,158,11,.4));}
  @keyframes dash{to{stroke-dashoffset:-20;}}
  .a-main{stroke:var(--accent);stroke-width:1.5;fill:none;marker-end:url(#aB);}
  .a-yes{stroke:var(--accent3);stroke-width:1.5;fill:none;marker-end:url(#aG);stroke-dasharray:6 3;animation:dash .8s linear infinite;}
  .a-no{stroke:var(--danger);stroke-width:1.5;fill:none;marker-end:url(#aR);stroke-dasharray:6 3;animation:dash .8s linear infinite;}
  .a-warn{stroke:var(--warn);stroke-width:1.5;fill:none;marker-end:url(#aW);}
  .fn{cursor:default;transition:opacity .2s;}.fn:hover{opacity:.85;}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:.6rem;font-weight:700;fill:var(--bg);}
  .sl{font-family:'IBM Plex Mono',monospace;font-size:.65rem;fill:var(--dim);letter-spacing:.08em;}
  .tip{position:fixed;background:#1e293b;border:1px solid var(--accent);border-radius:8px;padding:10px 14px;
    font-size:.78rem;color:var(--text);max-width:300px;pointer-events:none;opacity:0;transition:opacity .15s;
    z-index:1000;font-family:'IBM Plex Mono',monospace;line-height:1.6;box-shadow:0 8px 32px rgba(0,0,0,.6);}
  .tip.show{opacity:1;}
  .nav-link{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);text-decoration:none;
    padding:3px 10px;border:1px solid var(--border);border-radius:20px;
    transition:color .15s,border-color .15s;white-space:nowrap;}
  .nav-link:hover{color:var(--accent);border-color:var(--accent);}
  .nav-link.ext:hover{color:#e3b341;border-color:#e3b341;}
</style>
</head>
<body>
<header>
  <h1>CA BW Analyzer</h1>
  <span>동작 순서도 — v2.0 / 3GPP TS 38.101-1 V19.5.0</span>
  <nav style="margin-left:auto;display:flex;gap:6px;align-items:center;">
    <a href="index.html"    class="nav-link">← 분석기</a>
    <a href="workflow.html" class="nav-link">워크플로우</a>
    <a href="manual.pdf"    class="nav-link ext" target="_blank">매뉴얼 ↗</a>
  </nav>
</header>
<div class="legend">
  <div class="li"><div class="lb" style="background:rgba(0,212,255,.15);border:1.5px solid #00d4ff"></div>시작/종료</div>
  <div class="li"><div class="lb" style="background:#1e3a5f;border:1.5px solid #2563eb"></div>처리 단계</div>

  <div class="li" style="gap:6px"><svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 2"/></svg>NO</div>
</div>
<div class="canvas-wrap">
<svg id="fc" width="1000" height="2800" viewBox="0 0 1000 2800">
<defs>
  <marker id="aB" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#00d4ff"/></marker>
  <marker id="aG" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#10b981"/></marker>
  <marker id="aR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#ef4444"/></marker>
  <marker id="aW" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#f59e0b"/></marker>
  <filter id="fB" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="fG" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="fW" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00d4ff" stop-opacity=".06"/><stop offset="100%" stop-color="transparent"/>
  </linearGradient>
  <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7c3aed" stop-opacity=".06"/><stop offset="100%" stop-color="transparent"/>
  </linearGradient>
  <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#10b981" stop-opacity=".06"/><stop offset="100%" stop-color="transparent"/>
  </linearGradient>
</defs>

     레이아웃 설계
     중앙 X = 440  (메인 플로우)

<!-- 섹션 배경 -->
<rect x="20" y="60"   width="960" height="210" rx="4" fill="url(#g1)" opacity=".6"/>
<rect x="20" y="290"  width="960" height="680" rx="4" fill="url(#g2)" opacity=".6"/>
<rect x="20" y="990"  width="960" height="1220" rx="4" fill="url(#g3)" opacity=".5"/>
<rect x="20" y="2230" width="960" height="530" rx="4" fill="url(#g3)" opacity=".4"/>

<text x="36" y="82" class="sl">▶ PHASE 1 — 입력 파싱 &amp; 칩셋 판단</text>
<text x="36" y="310" class="sl">▶ PHASE 2 — DB 조회 &amp; BCS 선택</text>
<text x="36" y="1010" class="sl">▶ PHASE 3 — 완전 탐색 &amp; Pareto 필터</text>
<text x="36" y="2250" class="sl">▶ PHASE 4 — 출력</text>

<!-- ══ START ══ -->
<g class="fn" data-tip="CA 조합 문자열을 입력합니다.&#10;예) n1A-n3A-n78C&#10;예) n1A-n40A-n77(2A)">
  <rect x="290" y="96" width="300" height="48" rx="24"
        fill="#001a2e" stroke="#00d4ff" stroke-width="2" filter="url(#fB)"/>
  <text x="440" y="126" text-anchor="middle" font-family="IBM Plex Mono,monospace"
        font-size="13" font-weight="700" fill="#00d4ff">▶  시작 — CA 조합 입력</text>
</g>

<!-- START → N1 -->
<line x1="440" y1="144" x2="440" y2="168" class="a-main"/>

<!-- ══ N1: 밴드 파싱 ══ -->
<g class="fn" data-tip="입력 문자열에서 밴드명과 suffix를 파싱합니다.&#10;지원 표기: nXA / nXB / nXC / nX(2A) / nX(3A)&#10;예) n78(2A) → 밴드=n78, CC=2, TDD&#10;예) n7B → 밴드=n7, CC=2, FDD Intra">
  <rect x="290" y="168" width="300" height="56" rx="6" fill="#131c2e" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="314" cy="196" r="11" fill="#2563eb"/>
  <text x="314" y="200" text-anchor="middle" class="badge">1</text>
  <text x="446" y="191" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="12" fill="#e2e8f0">밴드 파싱 &amp; suffix 분류</text>
  <text x="446" y="206" text-anchor="middle" font-family="IBM Plex Sans KR,sans-serif" font-size="10" fill="#64748b">nXA / nXB / nXC / nX(2A) → {name, cc, isFDD, isTDD}</text>
  <text x="446" y="218" text-anchor="middle" font-family="IBM Plex Sans KR,sans-serif" font-size="10" fill="#64748b">CC수: A=1, B=2, C=2, D=3 (Table 5.3A.5-1)</text>
</g>

<!-- N1 → N2 -->
<line x1="440" y1="224" x2="440" y2="248" class="a-main"/>

<!-- ══ N2: F/T 카운트 ══ -->
<g class="fn" data-tip="FDD(F) 와 TDD(T) CC 수를 합산합니다.&#10;⚠ suffix→CC수는 반드시 Table 5.3A.5-1 참조&#10;⚠ 알파벳 순서로 CC수 추정 금지!&#10;fddUEMax = FDD 밴드 중 UE Max BW 최댓값">
  <rect x="290" y="248" width="300" height="56" rx="6" fill="#131c2e" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="314" cy="276" r="11" fill="#2563eb"/>
  <text x="314" y="280" text-anchor="middle" class="badge">2</text>
  <text x="446" y="271" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="12" fill="#e2e8f0">F/T 카운트 산정</text>
  <text x="446" y="286" text-anchor="middle" font-family="IBM Plex Sans KR,sans-serif" font-size="10" fill="#64748b">fCnt(FDD CC합) · tCnt(TDD CC합) · fddUEMax 계산</text>
  <text x="446" y="298" text-anchor="middle" font-family="IBM Plex Sans KR,sans-serif" font-size="10" fill="#64748b">1F+3T: fddUEMax≥40 → HI(40+220) / ≤30 → LO(30+240)</text>
</g>

<!-- N2 → D5CA -->
<line x1="440" y1="304" x2="440" y2="330" class="a-main"/>

<!-- ══ D5CA: 5CA 이상? ══ -->
<g class="fn" data-tip="총 CC 수(fCnt+tCnt)가 5 이상인지 확인합니다.&#10;예) n1A(1)+n3A(1)+n7A(1)+n78(2A)(2) = 5CC → BCS5&#10;예) n1A(1)+n3A(1)+n78C(2) = 4CC → 계속 진행&#10;⚠ 5CA 이상이면 DB 탐색 없이 즉시 BCS5 반환">
  <polygon points="440,330 570,390 440,450 310,390" fill="#1a1a2e" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="440" y="383" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" fill="#a78bfa">총 CC 수</text>
  <text x="440" y="398" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" fill="#c4b5fd">≥ 5 ?</text>
  <text x="440" y="413" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="9" fill="#8b5cf6">5CA 이상 체크</text>
</g>

<!-- D5CA YES → BCS5 출력 (오른쪽) -->
<path d="M570,390 L650,390 L650,432 L700,432" class="a-yes"/>
<text x="592" y="382" font-family="IBM Plex Mono,monospace" font-size="10" fill="#10b981">YES</text>
<g class="fn" data-tip="5CA 이상 — DB 탐색 없이 즉시 반환&#10;출력: BCS5 : {칩셋 키}&#10;예) BCS5 : 3F+2T&#10;실제 BW 조합은 3GPP 표준 문서 직접 확인 필요">
  <rect x="700" y="412" width="160" height="44" rx="6" fill="#1a1200" stroke="#f59e0b" stroke-width="1.5" filter="url(#fW)"/>
  <text x="780" y="429" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" fill="#fcd34d">BCS5 : {key}</text>
  <text x="780" y="444" text-anchor="middle" font-family="IBM Plex Sans KR,sans-serif" font-size="9" fill="#fbbf24">출력 후 종료 (5CA 이상)</text>
</g>

<!-- D5CA NO → DR0 -->
<line x1="440" y1="450" x2="440" y2="476" class="a-no"/>
<text x="448" y="467" font-family="IBM Plex Mono,monospace" font-size="10" fill="#ef4444">NO</text>

<!-- ══ DR0: 규칙 0 사전 검사 ══ -->
<g class="fn" data-tip="[규칙 0] 사전 검사 — No Limitation 여부 판단&#10;각 밴드별 단말 UE Max BW × CC수 합산:&#10;  FDD합계 ≤ fddMax AND TDD합계 ≤ tddMax&#10;→ 두 조건 모두 충족 시 No Limitation 즉시 출력&#10;→ 하나라도 초과 시 DB 조회 진행">
  <polygon points="440,476 570,536 440,596 310,536" fill="#1a1a2e" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="440" y="525" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" fill="#a78bfa">규칙 0</text>
  <text x="440" y="540" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="10" fill="#c4b5fd">단말 Max 합계</text>
  <text x="440" y="555" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="10" fill="#c4b5fd">≤ 칩셋 Max?</text>
</g>

<!-- DR0 YES → No Limitation (오른쪽) -->
<path d="M570,536 L650,536 L650,566 L700,566" class="a-yes"/>
<text x="592" y="528" font-family="IBM Plex Mono,monospace" font-size="10" fill="#10b981">YES</text>
<g class="fn" data-tip="No Limitation 출력 후 종료합니다.&#10;칩셋 제한 이내이므로 별도 BW 제한 없음&#10;단말이 지원하는 모든 BW 조합 사용 가능">
  <rect x="700" y="546" width="160" height="44" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1.5" filter="url(#fG)"/>
  <text x="780" y="563" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" fill="#34d399">No Limitation</text>
  <text x="780" y="578" text-anchor="middle" font-family="IBM Plex Sans KR,sans-serif" font-size="9" fill="#6ee7b7">출력 후 종료</text>
</g>

<!-- DR0 NO → N5 -->
<line x1="440" y1="596" x2="440" y2="624" class="a-no"/>
<text x="448" y="614" font-family="IBM Plex Mono,monospace" font-size="10" fill="#ef4444">NO</text>

<!-- ══ N5: DB 조회 ══ -->
<g class="fn" data-tip="[규칙 1] DB에서 CA 조합명으로 BCS 테이블을 조회합니다.&#10;키 형식: CA_n1A-n3A-n78C&#10;&#10;[ref 해석]&#10;  val.ref: CA_n78(2A)_BCS0 → base 키 탐색&#10;  FDD (2A) ref → B suffix fallback&#10;  ref에 BCS 4 and 5 포함 → 해당 BCS invalid 마킹&#10;&#10;BCS0 / BCS1 / BCS2 허용값 추출">
  <rect x="270" y="624" width="340" height="70" rx="6" fill="#131c2e" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="295" cy="650" r="11" fill="#2563eb"/>
  <text x="295" y="654" text-anchor="middle" class="badge">5</text>
  <text x="446" y="646" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="12" fill="#e2e8f0">DB 조회 — BCS 테이블</text>
  <text x="446" y="661" text-anchor="middle" font-family="IBM Plex Sans KR,sans-serif" font-size="10" fill="#64748b">키: CA_nXA-nYA → O(1) 직접 조회 (3,250개 DB)</text>
  <text x="446" y="675" text-anchor="middle" font-family="IBM Plex Sans KR,sans-serif" font-size="10" fill="#64748b">ref 해석: base 키 탐색 / FDD B fallback</text>
  <text x="446" y="688" text-anchor="middle" font-family="IBM Plex Sans KR,sans-serif" font-size="10" fill="#f59e0b">ref "BCS 4 and 5" 포함 → invalid 마킹</text>
</g>

<!-- N5 → D6 -->
<line x1="440" y1="694" x2="440" y2="720" class="a-main"/>

<!-- ══ D6: DB 조회 성공? ══ -->
<g class="fn" data-tip="DB에서 해당 CA 조합 키를 찾았는지 확인합니다.&#10;찾지 못하면 에러 출력 후 분석을 중단합니다.">
  <polygon points="440,720 560,774 440,828 320,774" fill="#1a1a2e" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="440" y="767" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" fill="#a78bfa">조합 발견?</text>
  <text x="440" y="782" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="10" fill="#c4b5fd">DB 키 존재 여부</text>
</g>

<!-- D6 NO → 에러 (오른쪽) -->
<path d="M560,774 L640,774 L640,810 L700,810" class="a-no"/>
<text x="580" y="766" font-family="IBM Plex Mono,monospace" font-size="10" fill="#ef4444">NO</text>
<g class="fn" data-tip="DB에서 CA 조합을 찾지 못한 경우&#10;에러를 출력하고 분석을 중단합니다.">
  <rect x="700" y="790" width="160" height="44" rx="6" fill="#2d1515" stroke="#ef4444" stroke-width="1.5"/>
  <text x="780" y="807" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" fill="#fca5a5">DB 미발견</text>
  <text x="780" y="822" text-anchor="middle" font-family="IBM Plex Sans KR,sans-serif" font-size="9" fill="#fca5a5">에러 출력 후 중단</text>
</g>

<!-- D6 YES → D7 -->
<line x1="440" y1="828" x2="440" y2="856" class="a-yes"/>
<text x="448" y="846" font-family="IBM Plex Mono,monospace" font-size="10" fill="#10b981">YES</text>

<!-- ══ D7: BCS4/5만? ══ -->
<g class="fn" data-tip="유효한 BCS0~2 데이터가 있는지 확인합니다.&#10;두 가지 케이스:&#10;① BCS 키 자체가 BCS4and5만 존재&#10;② 모든 BCS의 ref가 BCS 4 and 5 전용&#10;   (ref invalid 마킹된 BCS만 남은 경우)&#10;→ (BCS4 and 5) 출력 후 종료">
  <polygon points="440,856 560,910 440,964 320,910" fill="#1a1a2e" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="440" y="900" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" fill="#a78bfa">유효 BCS</text>
  <text x="440" y="915" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="10" fill="#c4b5fd">존재?</text>
  <text x="440" y="929" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="9" fill="#8b5cf6">BCS0~2 유효 여부</text>

<div class="tip" id="tip"></div>
<script>
const tip = document.getElementById('tip');
document.querySelectorAll('.fn').forEach(n => {
  const t = n.getAttribute('data-tip');
  if (!t) return;
  n.addEventListener('mouseenter', () => { tip.innerHTML = t.replace(/\n/g,'<br>'); tip.classList.add('show'); });
  n.addEventListener('mousemove', e => {
    let x=e.clientX+16, y=e.clientY+16;
    if(x+320>window.innerWidth) x=e.clientX-320;
    if(y+200>window.innerHeight) y=e.clientY-180;
    tip.style.left=x+'px'; tip.style.top=y+'px';
  });
  n.addEventListener('mouseleave', () => tip.classList.remove('show'));
});
</script>
